services:
  db:
    image: postgres:16-alpine
    container_name: drevenka_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-drevenka}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-drevenka_secret}
      POSTGRES_DB: ${POSTGRES_DB:-drevenka_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-drevenka} -d ${POSTGRES_DB:-drevenka_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: drevenka_app
    restart: unless-stopped
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - .:/app
    ports:
      - "${PORT:-8000}:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://drevenka:drevenka_secret@db:5432/drevenka_db}
      PROJECT_NAME: ${PROJECT_NAME:-Sklad Dřevěnka s.r.o.}
      APP_ENV: ${APP_ENV:-development}
      DEBUG: ${DEBUG:-True}
      RUN_MIGRATIONS_ON_START: "true"
      RUN_SEED_ON_START: "true"
    depends_on:
      db:
        condition: service_healthy

  app-tests:
    build: .
    profiles: ["test"]
    entrypoint: []
    command: ["pytest", "-q"]
    volumes:
      - .:/app
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://drevenka:drevenka_secret@db:5432/drevenka_db}
      APP_ENV: test
      DEBUG: "False"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
    name: drevenka_pgdata
