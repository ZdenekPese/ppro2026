services:
  db:
    image: postgres:16-alpine
    container_name: drevenka_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: drevenka
      POSTGRES_PASSWORD: drevenka_secret
      POSTGRES_DB: drevenka_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drevenka -d drevenka_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: drevenka_app
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://drevenka:drevenka_secret@db:5432/drevenka_db
      PROJECT_NAME: "Sklad Dřevěnka s.r.o."
      APP_ENV: development
      DEBUG: "True"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
    name: drevenka_pgdata
