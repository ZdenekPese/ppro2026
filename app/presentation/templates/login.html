<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title | default('Přihlášení — Dřevěnka s.r.o.') }}</title>
    <script>
        (function () {
            try {
                if (localStorage.getItem('drevenka_theme') === 'dark') {
                    document.documentElement.setAttribute('data-theme', 'dark');
                }
            } catch (e) {}
        })();
    </script>
    <link rel="stylesheet" href="/static/css/style.css?v=20261124_v5">
    <!-- Ikona webu (Favicon) - Dřevěnka s.r.o. -->
    <link rel="icon" type="image/svg+xml" href="/static/img/favicon.svg?v=20261124_v3">
    <link rel="alternate icon" type="image/x-icon" href="/favicon.ico?v=20261124_v3">
</head>
<body class="auth-body">
    <main class="auth-shell">
        <section class="auth-card">
            <div class="auth-brand">
                <span class="brand-badge">DŘEVĚNKA</span>
                <div>
                    <h1 class="auth-title">Dřevěnka s.r.o.</h1>
                    <p class="auth-subtitle">Skladový a objednávkový systém</p>
                </div>
                <button
                    type="button"
                    class="theme-toggle-btn auth-theme-toggle"
                    id="themeToggleBtn"
                    aria-label="Přepnout mezi světlým a tmavým režimem"
                    aria-pressed="false"
                    title="Přepnout světlý / tmavý režim"
                >
                    <span class="theme-icon-wrap theme-icon-moon" aria-hidden="true">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                    </span>
                    <span class="theme-icon-wrap theme-icon-sun" aria-hidden="true">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
                    </span>
                    <span class="theme-toggle-label">Tmavý</span>
                </button>
            </div>

            {% if logged_out %}
            <div class="auth-alert auth-alert-success" role="status">
                Byli jste úspěšně odhlášeni ze systému.
            </div>
            {% endif %}

            {% if error %}
            <div class="auth-alert auth-alert-error" role="alert">
                {{ error }}
            </div>
            {% endif %}

            <form method="post" action="/login" class="auth-form" autocomplete="on">
                <input type="hidden" name="next" value="{{ next_url | default('/') }}">

                <div class="form-group">
                    <label for="username" class="form-label">Uživatelské jméno</label>
                    <input
                        id="username"
                        name="username"
                        type="text"
                        class="form-control"
                        value="{{ username | default('') }}"
                        placeholder="např. dolezal nebo skladnik"
                        autocomplete="username"
                        required
                        autofocus
                    >
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">Heslo</label>
                    <div class="password-input-wrap">
                        <input
                            id="password"
                            name="password"
                            type="password"
                            class="form-control"
                            placeholder="Zadejte heslo"
                            autocomplete="current-password"
                            required
                        >
                        <button
                            type="button"
                            class="btn-password-toggle"
                            id="togglePasswordBtn"
                            aria-label="Zobrazit nebo skrýt heslo"
                        >
                            Zobrazit
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary auth-submit-btn">
                    Přihlásit se
                </button>
            </form>

            <div class="auth-switch-row">
                <span>Nakupujete u nás poprvé?</span>
                <a href="/register" class="auth-switch-link">Vytvořit účet zákazníka</a>
            </div>
        </section>

        <footer class="auth-footer">
            <span>Dřevěnka s.r.o. | Interní skladový systém PPRO 2026</span>
        </footer>
    </main>

    <script>
        (function () {
            const themeBtn = document.getElementById('themeToggleBtn');
            const syncThemeButton = function () {
                if (!themeBtn) return;
                const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
                themeBtn.setAttribute('aria-pressed', isDark ? 'true' : 'false');
                themeBtn.title = isDark ? 'Přepnout na světlý režim' : 'Přepnout na tmavý režim';
                const label = themeBtn.querySelector('.theme-toggle-label');
                if (label) {
                    label.textContent = isDark ? 'Světlý' : 'Tmavý';
                }
            };
            syncThemeButton();
            if (themeBtn) {
                themeBtn.addEventListener('click', function () {
                    const nextDark = document.documentElement.getAttribute('data-theme') !== 'dark';
                    if (nextDark) {
                        document.documentElement.setAttribute('data-theme', 'dark');
                    } else {
                        document.documentElement.removeAttribute('data-theme');
                    }
                    try {
                        localStorage.setItem('drevenka_theme', nextDark ? 'dark' : 'light');
                    } catch (e) {}
                    syncThemeButton();
                });
            }

            const passwordInput = document.getElementById('password');
            const toggleBtn = document.getElementById('togglePasswordBtn');
            const usernameInput = document.getElementById('username');

            if (toggleBtn && passwordInput) {
                toggleBtn.addEventListener('click', function () {
                    const isHidden = passwordInput.type === 'password';
                    passwordInput.type = isHidden ? 'text' : 'password';
                    toggleBtn.textContent = isHidden ? 'Skrýt' : 'Zobrazit';
                });
            }
        })();
    </script>
</body>
</html>
