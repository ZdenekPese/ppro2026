[project]
name = "drevenka-warehouse"
version = "0.1.0"
description = "Skladový systém pro e-shop Dřevěnka s.r.o."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.31.0",
    "sqlalchemy>=2.0.35",
    "psycopg[binary]>=3.2.0",
    "alembic>=1.13.3",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.5.2",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.12",
    "pytest>=8.3.3",
    "httpx>=0.27.2",
]

[tool.pyright]
include = ["app", "tests", "alembic"]
extraPaths = [".venv/Lib/site-packages", ".venv/lib/site-packages"]
reportMissingImports = false
reportMissingTypeStubs = false

[tool.ruff]
line-length = 100
target-version = "py312"
